<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17472f" />
    <title>ShambaLink | Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #23382b; background: #f7f7f2; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 30px; border: 1px solid #e4e9df; border-radius: 22px; background: white; }
      h1 { margin-top: 0; color: #17472f; }
      button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; color: white; background: #236b48; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body><main><h1>You’re offline</h1><p>Reconnect to load ShambaLink. Previously saved farm and crop information stays on this device.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
